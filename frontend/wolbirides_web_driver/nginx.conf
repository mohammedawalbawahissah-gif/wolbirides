# Keep the protocol the visitor actually used when TLS ends in front of this container
# (Render, Railway, a load balancer): otherwise Django sees "http" and redirects forever.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 12m;  # driver document uploads

    # Security headers (audit M5). The content security policy only allows this app's own
    # scripts, so an injected script can't run and read the sign-in token.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https:; connect-src 'self' ws://$http_host wss://$http_host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;


    # Look the backend up again as we go (Docker's own DNS), instead of once when nginx starts. Otherwise every
    # rebuild of the backend gives it a new internal address, nginx keeps sending to the old one, and every
    # request fails with "502 Bad Gateway" until this container is restarted. As a bonus nginx now starts
    # even if the backend isn't up yet. A variable in proxy_pass sends the request path through unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # keep driver/trip sockets open
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
